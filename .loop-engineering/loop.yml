objective: "Verify mini-agent milestones"
max_iterations: 1
allowed_actions:
  - read_files
  - edit_files
  - run_tests
blocked_actions:
  - deploy
  - destructive_cleanup
eval_gates:
  - id: tests
    command: "npm test"
    required: true
  - id: typecheck
    command: "npm run typecheck"
    required: true
  - id: build
    command: "npm run build"
    required: true
  - id: diff
    command: "git diff --check"
    required: true
commit:
  enabled: false
  push: false
memory:
  enabled: false
